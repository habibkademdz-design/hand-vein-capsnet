# Default Configuration for Hand Vein CapsNet

# ==================== DATA ====================
data:
  data_dir: "data/ROI_Directory/"
  img_size: 128
  num_subjects: 276
  num_acquisitions: 4  # L1, L2, L3, L4
  validation_split: 0.2
  test_split: 0.1
  random_seed: 42

# ==================== DATA AUGMENTATION ====================
augmentation:
  rotation_range: 10
  width_shift_range: 0.05
  height_shift_range: 0.05
  zoom_range: 0.1
  horizontal_flip: true
  vertical_flip: true
  fill_mode: "reflect"
  elastic_deformation:
    enabled: true
    alpha: 30
    sigma: 3

# ==================== MODEL ARCHITECTURE ====================
model:
  # Conv layers before primary capsules
  conv_layers:
    - filters: 64
      kernel_size: 5
      strides: 1
      activation: "relu"
      batch_norm: true
    
    - filters: 128
      kernel_size: 3
      strides: 1
      activation: "relu"
      batch_norm: true
      maxpool: 2
    
    - filters: 256
      kernel_size: 3
      strides: 1
      activation: "relu"
      batch_norm: true
  
  # Primary capsules
  primary_capsules:
    num_types: 32
    num_dims: 8
    kernel_size: 9
    strides: 2
    squashing: true
  
  # Class capsules
  class_capsules:
    num_subjects: 276
    num_dims: 16
  
  # Routing
  routing:
    num_iterations: 3
    leaky_entropy_reg: 0.005

# ==================== TRAINING ====================
training:
  batch_size: 32
  epochs: 200
  optimizer: "adam"
  learning_rate: 0.001
  learning_rate_decay: 0.95
  decay_steps: 10000
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    monitor: "val_accuracy"
    mode: "max"
  
  # Model checkpointing
  checkpoint:
    enabled: true
    save_best_only: true
    monitor: "val_accuracy"
    save_dir: "checkpoints/"

# ==================== REGULARIZATION ====================
regularization:
  # Margin loss
  margin_loss:
    m_plus: 0.9
    m_minus: 0.1
    lambda_: 0.5
  
  # L2 regularization
  l2_regularization: 0.0001
  
  # Dropout (if needed)
  dropout_rate: 0.0

# ==================== VALIDATION STRATEGY ====================
validation:
  strategy: "loao"  # Leave-One-Acquisition-Out
  use_fold: "fold"  # which fold to use (1, 2, 3, or 4)

# ==================== LOGGING & MONITORING ====================
logging:
  verbose: 1  # 0: silent, 1: progress bar, 2: detailed
  tensorboard:
    enabled: true
    log_dir: "logs/"
  
  # Metrics to track
  metrics:
    - "accuracy"
    - "top_5_accuracy"
    - "precision"
    - "recall"

# ==================== INFERENCE ====================
inference:
  batch_size: 64
  save_predictions: true
  predictions_dir: "predictions/"

# ==================== HARDWARE ====================
hardware:
  gpu_enabled: true
  mixed_precision: false
